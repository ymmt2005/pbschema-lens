title: "Acme Protobuf API"
input: "."
output: "dist"
base: "/"

source:
  repository: "github:acme/apis"

documentation:
  include:
    - "acme/**"
  exclude:
    - "google/api/**"
    - "buf/validate/**"

wellKnownTypes:
  enabled: true

search:
  symbolIndex: true
  fullText: true

sourceBrowser:
  enabled: true

artifacts:
  descriptorSet: true
  symbolIndex: true

playground: true
