title: "Acme Protobuf API"
input: "."
output: "dist"
base: "/"

# Optional. Adds a separate "View on GitHub" link; View source always uses the in-site browser.
# source:
#   repository: "github:org/repo"

documentation:
  include:
    - "acme/**"
  exclude:
    - "google/api/**"
    - "buf/validate/**"
    - "cybozu/validate/**"

wellKnownTypes:
  enabled: true

search:
  symbolIndex: true
  fullText: true

sourceBrowser:
  enabled: true

artifacts:
  descriptorSet: true
  symbolIndex: true
