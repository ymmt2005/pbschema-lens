name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: bufbuild/buf-setup-action@v1
      - name: Install
        run: npm ci
      - name: Test display helpers
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build UI
        run: npm run build:ui
      - name: Test Go
        run: go test ./...
      - name: Build CLI
        run: go build -o pbschema-lens ./cmd/pbschema-lens
      - name: Doctor
        run: buf build examples/acme -o - --as-file-descriptor-set | ./pbschema-lens doctor --config examples/acme/pbschema-lens.yaml
      - name: Build example site
        run: buf build examples/acme -o - --as-file-descriptor-set | ./pbschema-lens build --config examples/acme/pbschema-lens.yaml --out dist --base "/${{ github.event.repository.name }}/" --source examples/acme/proto
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
