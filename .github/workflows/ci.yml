name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Read pinned tool versions
        id: tools
        run: node scripts/dependency-updates.mjs tools >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
          version: ${{ steps.tools.outputs.buf }}
          github_token: ${{ github.token }}
      - name: Install
        run: npm ci
      - name: Test dependency update policy
        run: npm run test:updates
      - name: Test display helpers
        run: npm test
      - name: Install aqua and checksum-pinned lychee
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: ${{ steps.tools.outputs.aqua }}
          aqua_opts: ""
        env:
          AQUA_ENFORCE_CHECKSUM: "true"
          AQUA_ENFORCE_REQUIRE_CHECKSUM: "true"
      - name: Typecheck
        run: npm run typecheck
      - name: Build UI
        run: npm run build:ui
      - name: Test Go
        run: go test ./...
      - name: Build CLI
        run: go build -o pbschema-lens ./cmd/pbschema-lens
      - name: Doctor
        run: buf build examples/acme -o - --as-file-descriptor-set | ./pbschema-lens doctor --config examples/acme/pbschema-lens.yaml
      - name: Build example site
        run: buf build examples/acme -o - --as-file-descriptor-set | ./pbschema-lens build --config examples/acme/pbschema-lens.yaml --out dist --base "/${{ github.event.repository.name }}/" --source examples/acme/proto
      - name: Offline internal links at both base paths
        id: links
        run: npm run test:links
      - name: Check fixed tool checksums
        if: always() && steps.links.outcome != 'skipped'
        run: git diff --exit-code -- aqua-checksums.json
      - name: Publish internal-link diagnostics
        if: always() && steps.links.outcome != 'skipped'
        env:
          RESULT: ${{ steps.links.outcome }}
        run: |
          printf '## Offline internal links\n\nResult: %s\n\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          for report in .pbschema-lens/link-reports/*.md; do
            if [ -f "$report" ]; then
              printf '\n### %s\n\n' "$(basename "$report")" >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Save failed link reports
        if: failure() && steps.links.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: internal-link-reports
          path: .pbschema-lens/link-reports/
          if-no-files-found: warn
          include-hidden-files: true
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Read pinned tool versions
        id: tools
        run: node scripts/dependency-updates.mjs tools >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
          version: ${{ steps.tools.outputs.buf }}
          github_token: ${{ github.token }}
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: e2e/.results
          if-no-files-found: ignore
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
