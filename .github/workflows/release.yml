name: Release tarball

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Pack and smoke-test
        run: npm run pack:smoke
      - name: Build release tarball
        run: |
          npm run build
          versioned="$(npm pack --silent)"
          cp "$versioned" pbschema-lens.tgz
          echo "VERSIONED=$versioned" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VERSIONED" pbschema-lens.tgz --clobber
          else
            gh release create "$TAG" "$VERSIONED" pbschema-lens.tgz \
              --title "$TAG" \
              --generate-notes
          fi
