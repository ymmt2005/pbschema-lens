name: Release binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Detect version bump
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-detect.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.release == 'true'
        with:
          node-version-file: package.json
          cache: npm
      - name: Read pinned tool versions
        if: steps.detect.outputs.release == 'true'
        id: tools
        run: node scripts/dependency-updates.mjs tools >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.detect.outputs.release == 'true'
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        if: steps.detect.outputs.release == 'true'
        with:
          setup_only: true
          version: ${{ steps.tools.outputs.buf }}
          github_token: ${{ github.token }}
      - name: Install and test
        if: steps.detect.outputs.release == 'true'
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build:ui
          go test ./...
      - name: Tag
        if: steps.detect.outputs.release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists"
          else
            git tag -a "${tag}" "${GITHUB_SHA}" -m "${tag}"
            git push origin "${tag}"
          fi
          tag_commit="$(git rev-parse "${tag}^{commit}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${tag} points at ${tag_commit}, not this commit ${GITHUB_SHA}"
            exit 1
          fi
      - name: Publish binaries
        if: steps.detect.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ steps.tools.outputs.goreleaser }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
