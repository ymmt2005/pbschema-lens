name: Release binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Detect version bump
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-detect.sh
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.release == 'true'
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        if: steps.detect.outputs.release == 'true'
        with:
          go-version: "1.23"
      - uses: bufbuild/buf-setup-action@v1
        if: steps.detect.outputs.release == 'true'
      - name: Install and test
        if: steps.detect.outputs.release == 'true'
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build:ui
          go test ./...
      - name: Tag
        if: steps.detect.outputs.release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists"
          else
            git tag -a "${tag}" "${GITHUB_SHA}" -m "${tag}"
            git push origin "${tag}"
          fi
          tag_commit="$(git rev-parse "${tag}^{commit}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${tag} points at ${tag_commit}, not this commit ${GITHUB_SHA}"
            exit 1
          fi
      - name: Publish binaries
        if: steps.detect.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
