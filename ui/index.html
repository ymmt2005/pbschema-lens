    <script>
      try {
        var stored = localStorage.getItem("pbschema-lens-theme");
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (stored !== "light" && systemDark)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
